# Toy car: our own canvas game (games/toy_car). Opened as a local file, no server needed.
game: toy_car
adapter: browser
url: games/toy_car/index.html

# stepped: Python advances the game exactly `frames_per_action` frames per step (deterministic, fast).
# realtime: the game runs on its own clock and Python holds keys, like a human (and like Blue Car).
timing: stepped
frames_per_action: 4
fps: 60
headless: false

# Action index -> keys held during that step. Edit freely; the env uses len(actions).
actions:
  - []                        # 0 coast
  - [ArrowUp]                 # 1 gas
  - [ArrowLeft]               # 2 left
  - [ArrowRight]              # 3 right
  - [ArrowUp, ArrowLeft]      # 4 gas + left
  - [ArrowUp, ArrowRight]     # 5 gas + right
  - [ArrowDown]               # 6 brake

# JS hooks exposed by game.js
ready_expr: window.gameReady === true
state_expr: window.gameState
reset_expr: window.resetGame(seed ?? undefined)
step_expr: window.stepGame(keys, frames)
setup_exprs:
  - window.setMode('stepped')
  - window.gameConfig.lapsToFinish = 1
  - window.gameConfig.maxFrames = 60 * 90
  - window.gameConfig.difficulty = 'hard'   # 'easy' (brake never needed) or 'hard' (grip limit, tight corners)
