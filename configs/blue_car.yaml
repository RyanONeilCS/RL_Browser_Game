# Blue Car (Unity WebGL on itch.io). DRAFT for phase 5: selectors are untested.
# The game has no JS hooks, so there is no state/reset/step expression: real-time only,
# frames come from screenshots, and reset falls back to reloading the page.
game: blue_car
adapter: browser
url: https://kaboochy.itch.io/blue-car

timing: realtime
frames_per_action: 4
fps: 60
headless: false              # Unity WebGL may not render properly headless; check this first
viewport: {width: 1280, height: 900}

click_before_start:
  - .load_iframe_btn         # itch's "Run game" button (only present on click-to-play pages)
frame_selector: "#game_drop"  # the iframe itch loads the game into
canvas_selector: canvas
load_timeout_ms: 60000

# TODO (phase 5): confirm the real controls by playing the game.
actions:
  - []
  - [ArrowUp]
  - [ArrowLeft]
  - [ArrowRight]
  - [ArrowUp, ArrowLeft]
  - [ArrowUp, ArrowRight]
  - [ArrowDown]
